<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Arial,sans-serif;background:#05070A;color:#E6E9EF;font-size:13px;line-height:1.45;}
.mono{font-family:"JetBrains Mono","DejaVu Sans Mono",monospace}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
.side{background:#080B10;border-right:1px solid rgba(255,255,255,.06);padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
.brand i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#3B74FF,#8FB0FF);box-shadow:0 0 14px rgba(59,116,255,.6)}
.brand b{font-size:13px;letter-spacing:.08em}.brand small{display:block;font-size:9px;color:#7E8696;letter-spacing:.14em}
.nv{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:9px;color:#8A92A2;font-size:12.5px}
.nv svg{width:15px;height:15px;flex:none}
.nv.on{background:rgba(59,116,255,.14);color:#fff;box-shadow:inset 2px 0 0 #3B74FF}
.side .sp{flex:1}
.upd{border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:12px;font-size:11px;color:#8A92A2}
.upd b{display:flex;align-items:center;gap:6px;color:#3DD68C;font-weight:500;margin-bottom:4px}
.upd b::before{content:"";width:6px;height:6px;border-radius:50%;background:#3DD68C;box-shadow:0 0 8px #3DD68C}
.main{padding:22px 26px;display:flex;flex-direction:column;gap:16px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:19px;font-weight:600}
.top p{color:#7E8696;font-size:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.f{border:1px solid rgba(255,255,255,.09);border-radius:8px;padding:7px 11px;font-size:11.5px;color:#B5BCC9;display:flex;align-items:center;gap:6px}
.f.on{border-color:rgba(59,116,255,.6);color:#fff;background:rgba(59,116,255,.12)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.k{background:#0A0D13;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden}
.k .l{font-size:11px;color:#7E8696;display:flex;justify-content:space-between}
.k .v{font-size:26px;font-weight:600;margin:6px 0 2px;letter-spacing:-.01em}
.k .d{font-size:11px;color:#3DD68C}
.k .d.dn{color:#F2555A}
.k svg.sp{position:absolute;right:12px;bottom:12px;width:80px;height:28px}
.row{display:grid;gap:12px}
.r1{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.r2{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.card{background:#0A0D13;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:16px;min-width:0}
.ch{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px}
.ch b{font-size:13.5px;font-weight:600}
.ch small{display:block;color:#7E8696;font-size:11px;margin-top:2px}
.tag{font-size:10px;padding:4px 8px;border-radius:6px;background:rgba(59,116,255,.12);color:#8FB0FF;white-space:nowrap}
.legend{display:flex;gap:14px;font-size:11px;color:#9AA2B1;margin-top:8px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:9px;height:9px;border-radius:3px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:#7E8696;font-weight:500;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:0 8px 9px;border-bottom:1px solid rgba(255,255,255,.06)}
td{padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap}
td.num{font-family:"JetBrains Mono",monospace}
.rk{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.05);display:inline-flex;align-items:center;justify-content:center;font-size:11px}
tr:nth-child(-n+3) .rk{background:rgba(59,116,255,.2);color:#8FB0FF}
.pl{display:inline-flex;align-items:center;gap:6px}.pl i{width:8px;height:8px;border-radius:2px}
.up{color:#3DD68C}.dn{color:#F2555A}

        '<ol class="steps"><li><b>Kumpulkan</b> artikel, panduan, dan halaman resmi platform tentang produk digital yang dijual di Indonesia (2025–2026).</li><li><b>Bersihkan</b>: produk yang sama dengan nama berbeda disatukan ke dalam '+DATA.categories.length+' kategori.</li><li><b>Analisis</b>: skor sinyal = persentase dari '+N+' sumber tren yang menyebut kategori sebagai laris. Rentang harga dan biaya platform diambil apa adanya dari sumber.</li><li><b>Validasi</b>: kategori yang hanya muncul di 1 sumber diberi skor rendah dan tidak dijadikan kesimpulan utama.</li><li><b>Sajikan</b> dalam dashboard ini, lalu diperbarui setiap minggu.</li></ol>') +
      card("Batasan Data", "Supaya kamu membaca angka dengan tepat",
        '<ul class="facts"><li><b>Bukan data penjualan</b><span>Platform seperti Lynk.id, Shopee, dan TikTok Shop tidak membuka data penjualan ke publik. Skor di dashboard ini mengukur seberapa kuat sinyal dari sumber, bukan jumlah produk terjual.</span></li><li><b>Harga global</b><span>Harga bertanda * berasal dari pasar global (Gumroad/Etsy) dan bisa lebih tinggi dari harga di Indonesia.</span></li><li><b>Biaya platform</b><span>Tarif bisa berubah sewaktu-waktu. Cek halaman resmi sebelum memutuskan.</span></li></ul>') + '</div>' +
      card("Daftar Sumber", DATA.sources.length + " sumber publik", '<ol class="srcs">' + DATA.sources.map(function(s){ return '<li><span class="sid">'+esc(s.id)+'</span><a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.name)+'</a></li>'; }).join("") + '</ol>');
  }
};

function pageHead(title, filters){
  return '<div class="top"><div><h1>'+esc(title)+'</h1><p>Indonesia · '+esc(DATA.edition.label)+' · diperbarui '+esc(DATA.edition.updated)+'</p></div>' +
    (filters ? '<div class="filters">'+[7,30,90].map(function(d){ return '<button type="button" class="f'+(d===range?' on':'')+'" data-range="'+d+'">'+d+' hari</button>'; }).join("")+'</div>' : '') + '</div>';
}

var calcPrice = 49000, current = "ringkasan";
var main = $("#main"), navLinks = document.querySelectorAll("#nav .nv"), mtabs = $("#mtabs");
mtabs.innerHTML = Array.prototype.map.call(navLinks, function(a){ return '<a href="'+a.getAttribute("href")+'" data-p="'+a.getAttribute("data-p")+'">'+a.textContent.trim()+'</a>'; }).join("");
$("#updText").textContent = DATA.edition.label + ". Diperbarui " + DATA.edition.updated + ".";
function render(){
  var p = (location.hash || "#ringkasan").slice(1); if (!PAGES[p]) p = "ringkasan"; current = p;
  main.innerHTML = PAGES[p]();
  document.querySelectorAll("[data-p]").forEach(function(a){ a.classList.toggle("on", a.getAttribute("data-p") === p); });
  var act = mtabs.querySelector(".on"); if (act && act.scrollIntoView) { mtabs.scrollLeft = act.offsetLeft - 16; }
  document.title = "Nexus Digital Analytics · " + main.querySelector("h1").textContent;
}
main.addEventListener("click", function(e){
  var f = e.target.closest("[data-range]"); if (f){ range = +f.getAttribute("data-range"); render(); return; }
  var b = e.target.closest("[data-price]"); if (b){ calcPrice = +b.getAttribute("data-price"); render(); }
});
main.addEventListener("change", function(e){ if (e.target.id === "price"){ var v = Math.max(1000, Math.round(+e.target.value || 0)); calcPrice = v; render(); var i = $("#price"); if (i) i.focus(); } });
addEventListener("hashchange", function(){ render(); scrollTo(0, 0); });
render();
})();

</script>
</body>

</html>
